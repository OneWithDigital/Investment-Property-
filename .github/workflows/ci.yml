name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # Dummy values sufficient for `prisma generate` (schema validation
      # only, no live connection needed) and `next build` (which compiles
      # routes but doesn't execute them against a real database).
      DATABASE_URL: "postgresql://user:password@localhost:5432/ci"
      NEXTAUTH_SECRET: "ci-only-secret"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
