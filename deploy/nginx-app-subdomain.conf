# Nginx reverse proxy for the Investment Property Analyzer, on its own
# subdomain, completely separate from whatever serves myfinancial.help
# itself (WordPress). Copy this to /etc/nginx/sites-available/, replace
# the two placeholders below, symlink it into sites-enabled, then run
# certbot to add SSL — see DEPLOYMENT.md Step 7.
#
# Placeholders to replace:
#   app.myfinancial.help  -> your actual chosen subdomain
#   3001                -> whatever port you ran PM2 on in Step 5

server {
    listen 80;
    server_name app.myfinancial.help;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# After running `certbot --nginx -d app.myfinancial.help`, certbot will
# rewrite this file to add a matching `listen 443 ssl` server block and
# an HTTP->HTTPS redirect automatically — you don't need to write that
# part by hand.
